name: Publish Package

on:
  release:
    types: [created]

# OIDC trusted publishing (npmjs.com → package settings → Trusted Publisher:
# cybercussion/SCOBot, publish.yml, "npm stage publish" only). No NPM_TOKEN.
# The release is STAGED: approve it on npmjs.com (or `npm stage approve <id>`)
# with 2FA to make it live.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage` needs npm >= 11.19; Node 24's bundled npm may be older.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

      - run: npm stage publish .
